<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenClaw Agent Orchestrator</title>
  <desc id="hero-desc">Multi-agent daily collaboration: split a task, dispatch to resident agents via sessions_send, track progress, aggregate results with source attribution, retry failures. Shows a main agent orchestrating three worker agents in parallel and aggregating a sourced report.</desc>

  <rect width="1200" height="360" rx="20" fill="#0d1117"/>

  <!-- left: title block -->
  <g id="title-block" transform="translate(56 40)">
    <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#8b949e">OPENCLAW · AGENT SKILL</text>

    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Agent</text>
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Orchestrator</text>

    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#c9d1d9">拆任务 · 分 agent · 聚结果 · 失败重试</text>
    <text x="0" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#8b949e">sessions_send · 并行分发 · 来源可溯</text>

    <text x="0" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1" fill="#8b949e">MIT LICENSE · SKILL FOR OPENCLAW · v1.0.0</text>
  </g>

  <!-- right: orchestration panel -->
  <g id="orchestration-panel" transform="translate(690 44)">
    <rect width="460" height="276" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

    <!-- terminal dots -->
    <circle cx="18" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="20" r="5" fill="#27c93f"/>

    <text x="78" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b949e">orchestrator · 3 agents</text>

    <!-- main agent -->
    <rect x="24" y="48" width="120" height="40" rx="8" fill="#1f6feb" opacity="0.25"/>
    <text x="84" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#58a6ff">main</text>

    <!-- dispatch arrows -->
    <line x1="150" y1="68" x2="196" y2="68" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="4 3"/>
    <line x1="150" y1="68" x2="196" y2="110" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="4 3"/>
    <line x1="150" y1="68" x2="196" y2="152" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="4 3"/>

    <!-- worker agents -->
    <rect x="200" y="48" width="110" height="40" rx="8" fill="#238636" opacity="0.22"/>
    <text x="255" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3fb950">draw ✔</text>

    <rect x="200" y="90" width="110" height="40" rx="8" fill="#238636" opacity="0.22"/>
    <text x="255" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3fb950">research ✔</text>

    <rect x="200" y="132" width="110" height="40" rx="8" fill="#9e6a03" opacity="0.25"/>
    <text x="255" y="158" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#d29922">tech …</text>

    <!-- aggregate arrows -->
    <line x1="316" y1="68" x2="362" y2="120" stroke="#3fb950" stroke-width="1.6"/>
    <line x1="316" y1="110" x2="362" y2="126" stroke="#3fb950" stroke-width="1.6"/>
    <line x1="316" y1="152" x2="362" y2="132" stroke="#d29922" stroke-width="1.6"/>

    <!-- report -->
    <rect x="366" y="96" width="70" height="52" rx="8" fill="#bc4c00" opacity="0.22"/>
    <text x="401" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#f0883e">report</text>
    <text x="401" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">sourced</text>

    <!-- status lines -->
    <text x="24" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3fb950">$ sessions_send draw --timeout 0</text>
    <text x="24" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">  ✓ accepted (runId) · track via sessions_list</text>
    <text x="24" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">  ✓ 2/3 done · retry ≤ 3 on failure</text>
  </g>
</svg>
